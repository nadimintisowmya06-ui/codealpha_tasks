<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Explore Gallery</h1>
        <p>Discover beautiful moments through our collection</p>
    </header>

    <!-- Category Filters -->
    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="animals">Animals</button>
        <button class="filter-btn" data-category="travel">Travel</button>
    </div>

    <!-- Image Gallery -->
    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                 alt="Beautiful nature">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a"
                 alt="Cute dog">
        </div>

        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Beautiful beach">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                 alt="Mountain landscape">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d"
                 alt="Golden retriever">
        </div>

        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                 alt="Travel landscape">
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close-btn" id="closeBtn">&times;</button>

        <button class="nav-btn prev" id="prevBtn">&#10094;</button>

        <img id="lightboxImage" src="" alt="Gallery image">

        <button class="nav-btn next" id="nextBtn">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
